name: iOS

# Builds Ricochet Out on a macOS 26 runner (Xcode 26, iOS 26 SDK) and, for the
# appstore variant, uploads it to App Store Connect.
#
# Secrets: IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD, IOS_ADHOC_PROFILE_BASE64,
# IOS_PROVISION_PROFILE_BASE64, ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_BASE64.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which distribution to build
        type: choice
        default: adhoc
        options: [adhoc, appstore]
      upload:
        description: Upload to TestFlight (appstore variant only)
        type: boolean
        default: false

concurrency:
  group: ricochet-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    env:
      TEAM_ID: 3K2Z59RR7R
      BUNDLE_ID: kr.co.ddstudio.ricochet
      PROFILE_NAME: ${{ inputs.variant == 'adhoc' && 'Ricochet Out Ad Hoc' || 'Ricochet Out App Store' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        env:
          # The App Store binary must never show Google's test ads to a reviewer.
          VITE_STORE_RELEASE: ${{ inputs.variant == 'appstore' && '1' || '' }}
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios && node scripts/prune-ios-assets.mjs

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign hits errSecInternalComponent on the runner too.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ inputs.variant == 'adhoc' && secrets.IOS_ADHOC_PROFILE_BASE64 || secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
          echo "installed profile $UUID"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Point the App target at this run's profile
        run: |
          set -euo pipefail
          # The project pins the App Store profile by name. Passing signing
          # settings on the xcodebuild command line leaks into the Pods targets
          # and breaks them, so the App target's own setting is rewritten
          # instead — and only for an ad-hoc run.
          if [ "${{ inputs.variant }}" = "adhoc" ]; then
            /usr/bin/sed -i '' \
              's/PROVISIONING_PROFILE_SPECIFIER = "Ricochet Out App Store"/PROVISIONING_PROFILE_SPECIFIER = "Ricochet Out Ad Hoc"/g' \
              ios/App/App.xcodeproj/project.pbxproj
            grep -n 'PROVISIONING_PROFILE_SPECIFIER' ios/App/App.xcodeproj/project.pbxproj
          fi

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION=1.0.0 \
            archive

      - name: Export .ipa
        run: |
          set -euo pipefail
          # Xcode 16 renamed the ad-hoc export method to "release-testing".
          if [ "${{ inputs.variant }}" = "adhoc" ]; then METHOD=release-testing; else METHOD=app-store-connect; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ricochet-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: inputs.upload && inputs.variant == 'appstore'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
